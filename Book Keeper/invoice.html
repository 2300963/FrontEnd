<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - UtilityPay</title>
    <link rel="stylesheet" href="bookkeeper.css">
    <style>
        .invoice-box { background: white; padding: 40px; border: 1px solid #e2e8f0; max-width: 800px; margin: 2rem auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 20px; }
        @media print { .no-print { display: none !important; } .invoice-box { border: none; box-shadow: none; margin: 0; padding: 0; width: 100%; } body { background: white; } }
    </style>
</head>
<body>
    <nav class="navbar no-print">
        <div class="logo">UtilityPay</div>
        <div class="nav-links"><a href="bookkeeper.html" class="nav-item">Back to Logs</a></div>
    </nav>
    
    <div class="invoice-box">
        <div class="inv-header">
            <div>
                <h1 style="margin:0; color:var(--primary);">INVOICE</h1>
                <p style="margin:5px 0; color: var(--text-gray);">Ms. Merlyn's Services</p>
            </div>
            <div style="text-align: right;">
                <p><strong>Date:</strong> <span id="dt"></span></p>
            </div>
        </div>
        
        <h3 style="margin-bottom: 30px;">Billed To: <span id="cn" style="color: var(--primary);"></span></h3>
        
        <table>
            <thead style="background: #f8fafc;">
                <tr>
                    <th>Usage</th>
                    <th>Reading</th>
                    <th>Rate</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="border-bottom: 1px solid #eee;">Water Service</td>
                    <td style="border-bottom: 1px solid #eee;" id="rd"></td>
                    <td style="border-bottom: 1px solid #eee;" id="rt"></td>
                    <td style="border-bottom: 1px solid #eee; font-weight: bold; color: var(--primary);" id="tt"></td>
                </tr>
            </tbody>
        </table>
        
        <div style="text-align: right; margin-top: 40px;">
            <p style="color: var(--text-gray); margin-bottom: 5px;">Total Amount Due</p>
            <h2 style="margin:0; color: var(--primary);"><span id="ft"></span></h2>
        </div>
    </div>
    
    <div style="text-align:center; margin-bottom: 50px;" class="no-print">
        <button class="submit-btn" style="width: 200px;" onclick="window.print()">Print Invoice</button>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        document.getElementById('cn').innerText = p.get('customer') || "N/A";
        document.getElementById('rd').innerText = (p.get('reading') || "0") + " m³";
        document.getElementById('rt').innerText = "₱" + (p.get('rate') || "0.00");
        document.getElementById('tt').innerText = "₱" + (p.get('total') || "0.00");
        document.getElementById('ft').innerText = "₱" + (p.get('total') || "0.00");
        document.getElementById('dt').innerText = new Date().toLocaleDateString();
    </script>
</body>
</html>
